    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 bg-transparent">
        <div class="modal-body p-0">
          <img (click)="closeModal()" [src]="imageUrl" class="w-100" alt="Imagen">
        </div>
      </div>
    </div>
</div>
